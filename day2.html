<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 02 - HTML5 Forms and Validations</title>
</head>
<body>

    <header>
        <h1>Developer Registration & Feedback Portal</h1>
    </header>

    <main>
        <section>
            <h2>Connect with Me</h2>
            <form action="#" method="POST">
                <fieldset>
                    <legend>Personal Details</legend>

                    <div>
                        <label for="fullName">Full Name:</label>
                        <input type="text" id="fullName" name="fullName" placeholder="e.g. Rohit" required minlength="3">
                    </div>

                    <div>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="rohit@example.com" required>
                    </div>

                    <div>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10-digit number">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Technical Background</legend>

                    <div>
                        <label for="role">Primary Focus:</label>
                        <select id="role" name="role" required>
                            <option value="">-- Select Role --</option>
                            <option value="frontend">Frontend Developer</option>
                            <option value="backend">Backend Developer</option>
                            <option value="fullstack">Full-Stack MERN Developer</option>
                        </select>
                    </div>

                    <div>
                        <label for="experience">Years of Experience:</label>
                        <input type="number" id="experience" name="experience" min="0" max="20" value="0">
                    </div>

                    <div>
                        <label for="message">Project Description / Message:</label>
                        <textarea id="message" name="message" rows="4" cols="30" placeholder="Tell me about your project..."></textarea>
                    </div>
                </fieldset>

                <button type="submit">Submit Details</button>
                <button type="reset">Reset Form</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rohit. All rights reserved.</p>
    </footer>

</body>
</html>
