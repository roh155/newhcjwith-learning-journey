<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 06 - CSS Variables, Animations & Capstone Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="page-container">
        <article class="profile-card">
            <div class="card-glow"></div>
            
            <header class="card-header">
                <div class="avatar-ring">
                    <div class="avatar-placeholder">RB</div>
                </div>
                <h1 class="dev-name">Rohit Baheshwar</h1>
                <p class="dev-role">Full-Stack MERN Developer</p>
            </header>

            <section class="card-body">
                <p class="bio">
                    7th-semester CSE student building scalable web architectures with clean code, modern JavaScript, and fluid responsive design.
                </p>

                <div class="skills-wrapper">
                    <span class="skill-pill">HTML5</span>
                    <span class="skill-pill">CSS3 / Grid</span>
                    <span class="skill-pill">JavaScript ES6+</span>
                    <span class="skill-pill">React</span>
                    <span class="skill-pill">Node.js</span>
                    <span class="skill-pill">MongoDB</span>
                </div>
            </section>

            <footer class="card-footer">
                <a href="https://github.com/roh155" target="_blank" class="btn btn-primary">GitHub Profile</a>
                <button class="btn btn-secondary">Connect</button>
            </footer>
        </article>
    </main>

</body>
</html>
